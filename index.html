<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>متن‌یار | خلاصه‌ساز متن</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px 14px;background:#f4f5fb;color:#20243a;font-family:Tahoma,Arial,sans-serif}
main{max-width:760px;margin:25px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 12px 38px #26305b16}
header{text-align:center;margin-bottom:22px}h1{margin:0;color:#6254d9;font-size:2rem}p{color:#697087;line-height:1.9}
label{display:block;font-weight:bold;margin:18px 0 9px}
textarea{width:100%;min-height:210px;resize:vertical;border:1px solid #d9dced;border-radius:14px;padding:14px;font:inherit;line-height:2;outline-color:#7165e8}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{border:0;border-radius:12px;padding:13px 20px;font:inherit;cursor:pointer;background:#6558dc;color:white}
.secondary{background:#eef0fb;color:#454b68}
#result{min-height:110px;background:#f7f7fc;border:1px solid #e4e5f1;border-radius:14px;padding:14px;line-height:2;white-space:pre-wrap}
small{display:block;color:#777f94;line-height:1.8;margin-top:18px}
</style></head>
<body><main>
<header><h1>متن‌یار ✨</h1><p>متنت رو وارد کن و یک خلاصه‌ی کوتاه و مرتب تحویل بگیر.</p></header>
<label for="source">متن موردنظر</label>
<textarea id="source" placeholder="متن فارسی‌ات را اینجا وارد کن..."></textarea>
<div class="actions"><button onclick="summarize()">خلاصه کن</button><button class="secondary" onclick="clearAll()">پاک کردن</button></div>
<label>خلاصه متن</label><div id="result" aria-live="polite">خلاصه‌ی متن اینجا نمایش داده می‌شود.</div>
<small>نسخه‌ی آزمایشی: خلاصه‌سازی ساده داخل مرورگر انجام می‌شود؛ متن شما به سرور ارسال نمی‌شود.</small>
</main>
<script>
function summarize(){
 const raw=document.getElementById('source').value.trim(),out=document.getElementById('result');
 if(!raw){out.textContent='لطفاً ابتدا متن را وارد کن.';return;}
 const sentences=raw.split(/(?<=[.!؟?؛])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
 if(sentences.length<=2){out.textContent=raw;return;}
 const count=Math.max(2,Math.ceil(sentences.length*.35));
 const scored=sentences.map((s,i)=>({s,i,score:s.replace(/[،؛.!؟?()«»"]/g,' ').split(/\s+/).filter(w=>w.length>3).length/(i+1)}));
 out.textContent=scored.sort((a,b)=>b.score-a.score).slice(0,count).sort((a,b)=>a.i-b.i).map(x=>x.s).join(' ');
}
function clearAll(){document.getElementById('source').value='';document.getElementById('result').textContent='خلاصه‌ی متن اینجا نمایش داده می‌شود.';}
</script></body></html>
